schema_version: 2
repository:
  name: astetik
  description: Scientific visualization with centralized design and verifiable evidence
layout:
  package_root: astetik
  test_paths:
  - tests
  gate_test_paths:
  - governance/tests
  coverage_source: astetik
  excludes:
  - __pycache__
  - build
  - dist
runtime:
  python_version: '3.13'
review:
  approving_authority: mikkokotila
slice:
  label: slice
  issue_template: .github/ISSUE_TEMPLATE/slice.yml
  max_closing_references: 2
commits:
  types:
  - feat
  - fix
  - docs
  - style
  - refactor
  - perf
  - test
  - build
  - ci
  - chore
  - revert
changelog:
  header: '# v{version}'
  newest: first
bootstrap:
  timeout_minutes: 30
  secrets:
    bootstrap_token: REPO_BOOTSTRAP_TOKEN
    ruleset_audit_token: RULESET_AUDIT_TOKEN
  variables:
    ruleset_id: RULESET_ID
  labels_file: .github/labels.json
ruleset:
  name: Protect-Master
automation:
  bot_authors:
  - dependabot[bot]
  exempt_gates:
  - slice
  - version
gates:
  slice:
    enabled: true
    required: true
    context: pr_checks_slice
  cc:
    enabled: true
    required: true
    context: pr_checks_cc
  typing:
    enabled: true
    required: true
    context: pr_checks_typing
  fail_loud:
    enabled: true
    required: true
    context: pr_checks_fail_loud
  version:
    enabled: true
    required: true
    context: pr_checks_version
  honesty:
    required: true
    context: pr_checks_honesty
  ruleset:
    enabled: true
    required: true
    context: pr_checks_ruleset
  tests:
    required: true
    context: pr_checks_tests
  codeql:
    required: true
    context: PR Checks CodeQL (python)
  lint:
    enabled: true
    required: true
    context: pr_checks_lint
    ruff: true
    module_budgets: true
    dead_code: true
    dependency_vulnerabilities: true
    no_swallowed_violations: true
  packaging:
    enabled: true
    required: false
    context: pr_checks_packaging
    pyroma_min: 9
  package_install:
    required: false
  module_docstrings:
    enabled: true
    excludes: []
    exempt_below_significant_lines: 0
    exempt_filename_matching_single_symbol: false
  docstrings:
    enabled: true
    forbidden_title_verbs:
    - calculate
    - generate
    - make
    - build
  test_fallbacks:
    enabled: true
    excludes: []
  test_code_ratio:
    enabled: true
    min: 0.33
    max: 2.0
    min_source_sloc: 50
  file_size_balance:
    enabled: true
    max_ratio: 16.0
    min_files: 3
  coverage:
    enabled: true
    diff_floor: 80.0
    min_statements_for_track: 50
    min_branches_for_track: 20
    track_slack: 2
  runtime_budget:
    enabled: true
    slowest_tests_limit: 10
