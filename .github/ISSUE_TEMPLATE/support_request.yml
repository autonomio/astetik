name: Support Request
description: Ask for help with usage, setup, or documentation.
labels:
  - support
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State the exact support request.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include commands, versions, and error output.
    validations:
      required: true
