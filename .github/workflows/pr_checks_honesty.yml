name: pr_checks_honesty

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr_checks_honesty-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr_checks_honesty:
    name: pr_checks_honesty
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run honesty gate suite
        run: pytest governance/tests/test_repository_law.py governance/tests/test_copilot_review_gate.py -v --tb=short

      - name: Require submitted current-head Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          DISMISSED_REVIEW: ${{ github.event.action == 'dismissed' && github.event.review.id || '' }}
        run: |
          python governance/copilot_review_gate.py \
            "$REPOSITORY" "$PR_NUMBER" "$EXPECTED_HEAD" "$DISMISSED_REVIEW"
