name: Publish Release Files

# Publishes a verified release from protected master history with signed source identity.
#
# RELEASE_ENABLED activates verified GitHub files after an approved merge.
# PYPI_PUBLISH_ENABLED separately activates the existing PyPI upload job.
# Both paths retain protected-master source and released-tag verification.
#
# The filename guard is the important control: PyPI permanently rejects any
# filename it has ever accepted, even after the file is deleted, and deleted
# releases vanish from its JSON API. A reused version therefore fails in the
# least visible way possible, so the guard runs BEFORE anything is built.

on:
  # `release: published` alone would never fire here: the release is created by
  # scripts/create_release.py running under GITHUB_TOKEN, and GitHub does not
  # start workflow runs for events raised by that token. workflow_run on the
  # release workflow is the trigger that actually reaches this job.
  workflow_run:
    workflows: ['Automated Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable version tag to upload (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build_distribution:
    name: build_distribution
    if: >-
      ${{ (vars.RELEASE_ENABLED == 'true' || vars.PYPI_PUBLISH_ENABLED == 'true') &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'autonomio/astetik' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'master' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      source_identity: ${{ steps.verify_release.outputs.source_identity }}
      release_id: ${{ steps.verify_release.outputs.release_id }}
      publication_required: ${{ steps.verify_release.outputs.publication_required }}

    steps:
      - name: Checkout the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The workflow stays on master; validate candidate ancestry before execution.
          ref: ${{ github.event.workflow_run.head_sha || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify the published version tag
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python -I - <<'PYCODE'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          event_name = os.environ['GITHUB_EVENT_NAME']
          if (os.environ['GITHUB_REF'] != 'refs/heads/master'
                  or os.environ['GITHUB_REPOSITORY'] != 'autonomio/astetik'
                  or os.environ['GITHUB_WORKFLOW_REF'] != 'autonomio/astetik/.github/workflows/pr_publish_pypi.yml@refs/heads/master'
                  or os.environ['GITHUB_WORKFLOW_SHA'] != os.environ['GITHUB_SHA']):
              raise SystemExit('Publication requires the protected master ref and workflow')
          if event_name not in ('workflow_dispatch', 'workflow_run'):
              raise SystemExit('Publication requires a master dispatch or release workflow run')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          workflow_commit = os.environ['GITHUB_SHA']
          for ancestor, descendant in (
                  (head, workflow_commit), (workflow_commit, 'refs/remotes/origin/master')):
              ancestry = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', ancestor, descendant], check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit('Release and workflow source commit must belong to protected master history')
          repository = os.environ['GITHUB_REPOSITORY']
          if event_name == 'workflow_run':
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['workflow_run']
              if (event['name'] != 'Automated Release' or event['conclusion'] != 'success'
                      or event['head_branch'] != 'master'
                      or event['head_repository']['full_name'] != repository
                      or event['head_sha'] != head):
                  raise SystemExit('Release workflow provenance must identify this master commit')

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) is None:
              raise SystemExit('Published version must use MAJOR.MINOR.PATCH')
          tag = f'v{version}'
          if event_name == 'workflow_dispatch' and os.environ['RELEASE_TAG'] != tag:
              raise SystemExit('Dispatch tag must match the candidate version tag')
          listed = subprocess.check_output(['git', 'tag', '--list', tag], text=True).strip()
          if not listed and event_name == 'workflow_run':
              parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', head], text=True).split()[1:]
              if parents:
                  previous = subprocess.check_output(['git', 'show', f'{parents[0]}:pyproject.toml'], text=True)
                  if tomllib.loads(previous)['project']['version'] == version:
                      with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                          output.write('publication_required=false\n')
                      print(f'Skip {tag}: unchanged version has no release tag yet; no publication')
                      raise SystemExit(0)
          tagged = subprocess.check_output(
              ['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True,
          ).strip()
          if tagged != head:
              ancestry = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', tagged, head], check=False,
              )
              previous = subprocess.check_output(['git', 'show', f'{head}^1:pyproject.toml'], text=True)
              tagged_project = subprocess.check_output(['git', 'show', f'{tagged}:pyproject.toml'], text=True)
              if (event_name != 'workflow_run' or ancestry.returncode != 0
                      or tomllib.loads(previous)['project']['version'] != version
                      or tomllib.loads(tagged_project)['project']['version'] != version):
                  raise SystemExit('Version tag must identify the checked-out commit')
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repository}/releases/tags/{tag}'], text=True,
          ))
          if release['draft'] or release['prerelease'] or release['tag_name'] != tag:
              raise SystemExit('Version tag requires a published stable GitHub release')
          if tagged != head:
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write('publication_required=false\n')
              print(f'Skip {tag}: unchanged version already has a stable release on master history')
              raise SystemExit(0)
          if not isinstance(release['id'], int) or release['id'] <= 0:
              raise SystemExit('Published release requires a valid identity')
          identity = {
              'repository': f'https://github.com/{repository}', 'commit': head,
              'tag': tag, 'workflow_commit': workflow_commit,
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'source_identity={json.dumps(identity, separators=(",", ":"))}\n')
              output.write(f'release_id={release["id"]}\n')
              output.write('publication_required=true\n')
          print(f'Verified published {tag} at {head} on master history')
          PYCODE

      - name: Install packaging tools
        if: steps.verify_release.outputs.publication_required == 'true'
        run: |
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --require-hashes -r requirements/ci/packaging-tools.txt
          python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Guard against a burned filename
        if: steps.verify_release.outputs.publication_required == 'true'
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json
          import sys
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          name, version = project['name'], project['version']
          url = f'https://pypi.org/pypi/{name}/json'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f'{name} is not yet on PyPI; nothing can be burned')
                  sys.exit(0)
              raise
          burned = sorted(payload.get('releases', {}))
          if version in burned:
              files = [f['filename'] for f in payload['releases'][version]]
              print(f'::error::version {version} is burned on PyPI: {files}')
              print('PyPI permanently rejects a filename it has accepted. Bump past it.')
              sys.exit(1)
          print(f'{name} {version} is available ({len(burned)} released versions)')
          PY

      - name: Build the distributions
        if: steps.verify_release.outputs.publication_required == 'true'
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: python -m build --no-isolation

      - name: Record artifact digests
        if: steps.verify_release.outputs.publication_required == 'true'
        run: |
          set -euo pipefail
          {
            echo '### Artifact SHA-256'
            echo
            echo '```'
            (cd dist && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distributions
        if: steps.verify_release.outputs.publication_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-distributions
          path: dist
          if-no-files-found: error

  attest_distribution:
    name: attest_distribution
    needs: build_distribution
    if: needs.build_distribution.outputs.publication_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Signing credentials never share a runner with repository code or builds.
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Attest released source identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/*
          predicate-type: urn:autonomio:astetik:release-source:v1
          predicate: ${{ needs.build_distribution.outputs.source_identity }}

      - name: Retain signature bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-source-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  publish_release_assets:
    name: publish_release_assets
    needs: [build_distribution, attest_distribution]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-distributions
          path: dist
      - name: Download signature bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-source-bundle
          path: bundle
      - name: Verify signatures and publish exact-release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_IDENTITY: ${{ needs.build_distribution.outputs.source_identity }}
          RELEASE_ID: ${{ needs.build_distribution.outputs.release_id }}
        run: |
          set -euo pipefail
          python -I - <<'PYCODE'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repository = 'autonomio/astetik'
          identity = json.loads(os.environ['SOURCE_IDENTITY'])
          workflow_sha = os.environ['GITHUB_SHA']
          workflow = f'{repository}/.github/workflows/pr_publish_pypi.yml@refs/heads/master'
          if (os.environ['GITHUB_REF'] != 'refs/heads/master'
                  or os.environ['GITHUB_REPOSITORY'] != repository
                  or os.environ['GITHUB_WORKFLOW_REF'] != workflow
                  or os.environ['GITHUB_WORKFLOW_SHA'] != workflow_sha
                  or re.fullmatch(r'[0-9a-f]{40}', workflow_sha) is None
                  or set(identity) != {'repository', 'commit', 'tag', 'workflow_commit'}
                  or identity['repository'] != f'https://github.com/{repository}'
                  or identity['workflow_commit'] != workflow_sha
                  or re.fullmatch(r'[0-9a-f]{40}', identity['commit']) is None
                  or re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', identity['tag']) is None):
              raise SystemExit('Asset publication requires this verified protected master workflow')
          release_id = int(os.environ['RELEASE_ID'])
          release = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repository}/releases/tags/{identity["tag"]}',
          ], text=True))
          if (release['id'] != release_id or release['tag_name'] != identity['tag']
                  or release['draft'] or release['prerelease']):
              raise SystemExit('Asset publication requires the exact verified stable release')
          version = identity['tag'][1:]
          names = {f'astetik-{version}-py3-none-any.whl', f'astetik-{version}.tar.gz'}
          artifacts = sorted(Path('dist').iterdir())
          if {path.name for path in artifacts} != names or any(not path.is_file() or path.is_symlink() for path in artifacts):
              raise SystemExit('Exactly the expected wheel and source distribution are required')
          bundles = list(Path('bundle').iterdir())
          if len(bundles) != 1 or not bundles[0].is_file() or bundles[0].is_symlink():
              raise SystemExit('Exactly one generated signature bundle is required')
          trusted_root = Path('sigstore-trusted-root.jsonl')
          trusted_root.write_bytes(subprocess.check_output(['gh', 'attestation', 'trusted-root']))
          def verify_bundle(signed_bundle, signed_sha=None):
              for artifact in artifacts:
                  sha_flags = [] if signed_sha is None else ['--source-digest', signed_sha, '--signer-digest', signed_sha]
                  verified = json.loads(subprocess.check_output([
                      'gh', 'attestation', 'verify', str(artifact), '--repo', repository,
                      '--bundle', str(signed_bundle), '--custom-trusted-root', str(trusted_root),
                      '--digest-alg', 'sha256', '--cert-identity', f'https://github.com/{workflow}',
                      '--cert-oidc-issuer', 'https://token.actions.githubusercontent.com',
                      '--source-ref', 'refs/heads/master', '--deny-self-hosted-runners', *sha_flags,
                      '--predicate-type', 'urn:autonomio:astetik:release-source:v1', '--format', 'json',
                  ], text=True))
                  if len(verified) != 1:
                      raise SystemExit('Exactly one verified release-source statement is required')
                  proof = verified[0]['verificationResult']
                  predicate = proof['statement']['predicate']
                  certificate = proof['signature']['certificate']
                  candidate_sha = predicate['workflow_commit']
                  if (re.fullmatch(r'[0-9a-f]{40}', candidate_sha) is None
                          or (signed_sha is not None and candidate_sha != signed_sha)
                          or predicate != identity | {'workflow_commit': candidate_sha}
                          or certificate['sourceRepositoryDigest'] != candidate_sha
                          or certificate['buildSignerDigest'] != candidate_sha):
                      raise SystemExit('Verified release-source identity differs from the approved release')
                  signed_sha = candidate_sha
              return signed_sha

          verify_bundle(bundles[0], workflow_sha)
          bundle = Path('dist') / f'astetik-{version}.release-source.sigstore.json'
          retained = [asset for asset in release['assets'] if asset['name'] == bundle.name]
          if len(retained) > 1:
              raise SystemExit('Release signature bundle name must be unique')
          if retained:
              bundle.write_bytes(subprocess.check_output([
                  'gh', 'api', f'repos/{repository}/releases/assets/{retained[0]["id"]}',
                  '--header', 'Accept: application/octet-stream',
              ]))
              retained_sha = verify_bundle(bundle)
              comparison = json.loads(subprocess.check_output([
                  'gh', 'api', f'repos/{repository}/compare/{retained_sha}...{workflow_sha}',
              ], text=True))
              if (comparison['base_commit']['sha'] != retained_sha
                      or comparison['merge_base_commit']['sha'] != retained_sha
                      or comparison['status'] not in ('ahead', 'identical')
                      or comparison['url'] != f'https://api.github.com/repos/{repository}/compare/{retained_sha}...{workflow_sha}'):
                  raise SystemExit('Retained signing workflow must belong to current protected master history')
          else:
              bundle.write_bytes(bundles[0].read_bytes())
          artifacts.append(bundle)

          def existing_assets(payload):
              matches = [asset for asset in payload['assets'] if asset['name'] in {path.name for path in artifacts}]
              if len({asset['name'] for asset in matches}) != len(matches):
                  raise SystemExit('Release asset names must be unique')
              for asset in matches:
                  data = subprocess.check_output([
                      'gh', 'api', f'repos/{repository}/releases/assets/{asset["id"]}',
                      '--header', 'Accept: application/octet-stream',
                  ])
                  local = Path('dist') / asset['name']
                  if hashlib.sha256(data).digest() != hashlib.sha256(local.read_bytes()).digest():
                      raise SystemExit('Existing release asset differs; never replace published bytes')
              return {asset['name'] for asset in matches}

          existing = existing_assets(release)
          missing = [str(path) for path in artifacts if path.name not in existing]
          if missing:
              subprocess.run([
                  'gh', 'release', 'upload', identity['tag'], '--repo', repository, *missing,
              ], check=True)
          published = json.loads(subprocess.check_output([
              'gh', 'api', f'repos/{repository}/releases/{release_id}',
          ], text=True))
          if (published['id'] != release_id or published['tag_name'] != identity['tag']
                  or published['draft'] or published['prerelease']
                  or existing_assets(published) != {path.name for path in artifacts}):
              raise SystemExit('Published asset inventory does not match the verified release')
          print('Verified public wheel, source distribution and signature bundle; no assets replaced')
          PYCODE

  publish_to_pypi:
    name: publish_to_pypi
    needs: publish_release_assets
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish via trusted publishing
        # OIDC only: no long-lived token exists to leak.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
