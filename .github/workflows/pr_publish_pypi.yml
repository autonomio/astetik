name: Publish Package to PyPI

# Publishes a verified release from protected master history with signed source identity.
#
# Disabled unless the repository variable PYPI_PUBLISH_ENABLED is 'true'. The
# operator enables it only after trusted publishing, protected environments,
# and the released-tag verification below are configured and reviewed.
#
# The filename guard is the important control: PyPI permanently rejects any
# filename it has ever accepted, even after the file is deleted, and deleted
# releases vanish from its JSON API. A reused version therefore fails in the
# least visible way possible, so the guard runs BEFORE anything is built.

on:
  # `release: published` alone would never fire here: the release is created by
  # scripts/create_release.py running under GITHUB_TOKEN, and GitHub does not
  # start workflow runs for events raised by that token. workflow_run on the
  # release workflow is the trigger that actually reaches this job.
  workflow_run:
    workflows: ['Automated Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable version tag to upload (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build_distribution:
    name: build_distribution
    if: >-
      ${{ vars.PYPI_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/master' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'master' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      source_identity: ${{ steps.verify_release.outputs.source_identity }}

    steps:
      - name: Checkout the release candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # The workflow stays on master; validate candidate ancestry before execution.
          ref: ${{ github.event.workflow_run.head_sha || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.13'

      - name: Verify the published version tag
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python -I - <<'PYCODE'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          event_name = os.environ['GITHUB_EVENT_NAME']
          if os.environ['GITHUB_REF'] != 'refs/heads/master':
              raise SystemExit('Publication requires the protected master ref')
          if event_name not in ('workflow_dispatch', 'workflow_run'):
              raise SystemExit('Publication requires a master dispatch or release workflow run')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          workflow_commit = os.environ['GITHUB_SHA']
          for ancestor, descendant in (
                  (head, workflow_commit), (workflow_commit, 'refs/remotes/origin/master')):
              ancestry = subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', ancestor, descendant], check=False,
              )
              if ancestry.returncode != 0:
                  raise SystemExit('Release and workflow source commit must belong to protected master history')
          repository = os.environ['GITHUB_REPOSITORY']
          if event_name == 'workflow_run':
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())['workflow_run']
              if (event['name'] != 'Automated Release' or event['conclusion'] != 'success'
                      or event['head_branch'] != 'master'
                      or event['head_repository']['full_name'] != repository
                      or event['head_sha'] != head):
                  raise SystemExit('Release workflow provenance must identify this master commit')

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) is None:
              raise SystemExit('Published version must use MAJOR.MINOR.PATCH')
          tag = f'v{version}'
          if event_name == 'workflow_dispatch' and os.environ['RELEASE_TAG'] != tag:
              raise SystemExit('Dispatch tag must match the candidate version tag')
          tagged = subprocess.check_output(
              ['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True,
          ).strip()
          if tagged != head:
              raise SystemExit('Version tag must identify the checked-out commit')
          release = json.loads(subprocess.check_output(
              ['gh', 'api', f'repos/{repository}/releases/tags/{tag}'], text=True,
          ))
          if release['draft'] or release['prerelease'] or release['tag_name'] != tag:
              raise SystemExit('Version tag requires a published stable GitHub release')
          identity = {
              'repository': f'https://github.com/{repository}', 'commit': head,
              'tag': tag, 'workflow_commit': workflow_commit,
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'source_identity={json.dumps(identity, separators=(",", ":"))}\n')
          print(f'Verified published {tag} at {head} on master history')
          PYCODE

      - name: Install packaging tools
        run: |
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --require-hashes -r requirements/ci/packaging-tools.txt
          python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Guard against a burned filename
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import json
          import sys
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          name, version = project['name'], project['version']
          url = f'https://pypi.org/pypi/{name}/json'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(f'{name} is not yet on PyPI; nothing can be burned')
                  sys.exit(0)
              raise
          burned = sorted(payload.get('releases', {}))
          if version in burned:
              files = [f['filename'] for f in payload['releases'][version]]
              print(f'::error::version {version} is burned on PyPI: {files}')
              print('PyPI permanently rejects a filename it has accepted. Bump past it.')
              sys.exit(1)
          print(f'{name} {version} is available ({len(burned)} released versions)')
          PY

      - name: Build the distributions
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: python -m build --no-isolation

      - name: Record artifact digests
        run: |
          set -euo pipefail
          {
            echo '### Artifact SHA-256'
            echo
            echo '```'
            (cd dist && sha256sum ./*)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-distributions
          path: dist

  attest_distribution:
    name: attest_distribution
    needs: build_distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Signing credentials never share a runner with repository code or builds.
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: pypi-distributions
          path: dist

      - name: Attest released source identity
        uses: actions/attest@daf44fb950173508f38bd2406030372c1d1162b1  # v3.0.0
        with:
          subject-path: dist/*
          predicate-type: urn:autonomio:astetik:release-source:v1
          predicate: ${{ needs.build_distribution.outputs.source_identity }}

  publish_to_pypi:
    name: publish_to_pypi
    needs: attest_distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: pypi-distributions
          path: dist

      - name: Publish via trusted publishing
        # OIDC only: no long-lived token exists to leak.
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          attestations: true
