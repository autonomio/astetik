name: pr_checks_version

# Mechanical version + changelog gate. The deterministic rules are defined
# once, in governance/version_gate.py's module docstring (the single source);
# this workflow only runs it. "Whatever is changed must leave a trail and the
# version must change." No graceful skip, no bypass flag.

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr_checks_version:
    name: pr_checks_version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install gate toolchain
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Extract PR title from event payload
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${PR_TITLE:-}" ]; then
            echo "::error::github.event.pull_request.title is empty; this workflow only runs on pull_request events that carry a PR title"
            exit 1
          fi
          # Read from the event payload rather than shelling out to
          # `gh pr view` -- the title is already in the event context,
          # so the extra API call (and its rate-limit / transient-
          # failure surface) was unnecessary.
          printf '%s' "$PR_TITLE" > pr_title.txt
          echo "PR title: $PR_TITLE"

      - name: Extract base + head artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_REV="origin/${{ github.base_ref }}"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin "${{ github.base_ref }}" --depth=1
          git rev-parse --verify "$BASE_REV" >/dev/null

          # Base artifacts must exist; if either is missing the gate
          # cannot compare.
          if ! git show "$BASE_REV:pyproject.toml" > base_pyproject.toml 2>/dev/null; then
            echo "::error::base ref has no pyproject.toml; cannot run version gate"
            exit 1
          fi
          if ! git show "$BASE_REV:CHANGELOG.md" > base_CHANGELOG.md 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BASE_REV"...HEAD)"
            if echo "$CHANGED" | grep -qx 'CHANGELOG.md'; then
              : > base_CHANGELOG.md
              echo "::warning::bootstrap commit: base ref has no CHANGELOG.md; HEAD introduces it."
            else
              echo "::error::base ref has no CHANGELOG.md and this commit does not introduce it. Restore CHANGELOG.md before merging."
              exit 1
            fi
          fi

          # Retain only the version source declared by the protected base.
          # The gate parses its literal assignment without executing base code.
          BASE_VERSION_PATH="$(python - <<'PYCODE'
          import sys
          from pathlib import Path

          sys.path.insert(0, 'governance')
          from version_gate import historical_version_path

          print(historical_version_path(Path('base_pyproject.toml').read_text()) or '')
          PYCODE
          )"
          rm -f base_version_source.py
          if [ -n "$BASE_VERSION_PATH" ]; then
            git show "$BASE_REV:$BASE_VERSION_PATH" > base_version_source.py
          fi

          # Head artifacts come from the checkout -- they must be
          # present on the PR for the bump to be meaningful.
          if [ ! -f pyproject.toml ]; then
            echo "::error::head has no pyproject.toml"
            exit 1
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::head has no CHANGELOG.md"
            exit 1
          fi
          cp pyproject.toml head_pyproject.toml
          cp CHANGELOG.md head_CHANGELOG.md

          echo "base pyproject bytes:  $(wc -c < base_pyproject.toml)"
          echo "head pyproject bytes:  $(wc -c < head_pyproject.toml)"
          echo "base CHANGELOG bytes:  $(wc -c < base_CHANGELOG.md)"
          echo "head CHANGELOG bytes:  $(wc -c < head_CHANGELOG.md)"


      - name: Run version gate
        run: |
          set -euo pipefail
          PR_TITLE=$(cat pr_title.txt)
          HISTORICAL_VERSION_ARGS=()
          if [ -f base_version_source.py ]; then
            HISTORICAL_VERSION_ARGS=(--base-version-source base_version_source.py)
          fi
          python governance/version_gate.py \
            --pr-title "$PR_TITLE" \
            --base-pyproject base_pyproject.toml \
            --head-pyproject head_pyproject.toml \
            --base-changelog base_CHANGELOG.md \
            --head-changelog head_CHANGELOG.md \
            --pr-author "${{ github.event.pull_request.user.login }}" \
            "${HISTORICAL_VERSION_ARGS[@]}"

      - name: Recheck budget, coverage and runtime markers on metadata edits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          ADOPTION_ARGS=()
          MODE="$(BASE_REV="origin/$BASE_REF" python - <<'PYCODE'
          import os
          import sys
          sys.path.insert(0, 'governance')
          from _common import git_base_artifact, validate_initial_governance
          ref = os.environ['BASE_REV']
          budget = git_base_artifact(ref, '.github/budgets.json', 'RATCHET PREPARATION')
          config = git_base_artifact(ref, 'governance.yml', 'RATCHET PREPARATION')
          if budget is None:
              validate_initial_governance(ref, 'RATCHET PREPARATION')
              print('bootstrap')
          else:
              if config is None:
                  raise SystemExit('Protected base budget lacks its governing configuration')
              print('compare')
          PYCODE
          )"
          if [ "$MODE" = "bootstrap" ]; then
            ADOPTION_ARGS=(--bootstrap)
          fi
          python governance/check_budget_ratchet.py --base-ref "origin/$BASE_REF" --pr-number "$PR_NUMBER" "${ADOPTION_ARGS[@]}"
          python governance/check_coverage_ratchet.py --base-ref "origin/$BASE_REF" --pr-number "$PR_NUMBER" "${ADOPTION_ARGS[@]}"
          printf '%s' "$PR_BODY" > pr_body.txt
          python governance/check_test_runtime.py --check-ratchet-only --base-ref "origin/$BASE_REF" --pr-body-file pr_body.txt
