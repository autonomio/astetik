name: Scientific contracts
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    name: pr_checks_package_install (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked scientific test environment
        run: |
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest tests
      - run: python scripts/build_catalog.py --check
      - run: python -m build --no-isolation
      - name: Verify the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/astetik-wheel"
          source "$RUNNER_TEMP/astetik-wheel/bin/activate"
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PYTHON'
          import importlib.metadata as md
          import astetik
          installed = md.version('astetik')
          declared = getattr(astetik, '__version__', installed)
          assert declared == installed, (declared, installed)
          assert 'site-packages' in astetik.__file__, astetik.__file__
          PYTHON
          python -m pip check
  documentation:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site exec -- playwright install --with-deps chromium
      - run: npm --prefix docs-site run security:audit
      - run: npm --prefix docs-site run check
