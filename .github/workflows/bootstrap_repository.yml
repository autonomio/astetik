name: Bootstrap Repository

# Existing-repository activation is manual. This workflow applies the reviewed
# local labels/ruleset; it never specializes files or creates/merges a PR.
on:
  workflow_dispatch:
    inputs:
      confirm_repository:
        description: Type the full owner/repository to apply its reviewed governance configuration.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap Repository
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: governance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install bootstrap dependencies
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Apply labels and protected-master ruleset
        env:
          GH_TOKEN: ${{ secrets.REPO_BOOTSTRAP_TOKEN }}
          CONFIRM_REPOSITORY: ${{ inputs.confirm_repository }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::repository confirmation does not match the workflow target."
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REPO_BOOTSTRAP_TOKEN is required to apply reviewed labels/rulesets."
            exit 1
          fi
          python governance/bootstrap_repository.py \
            --repo-name "${GITHUB_REPOSITORY#*/}" \
            --owner "${GITHUB_REPOSITORY%/*}" \
            --github-only
