name: Automated Release

# Tags and releases the version on master. Runs after merge, never as a gate:
# a release is a consequence of a merge, not a condition of one.
#
# Every identifier is mechanical -- the tag comes from [project].version and
# the notes are the changelog's newest section verbatim -- so there is no
# release-time prose that can disagree with the artifact it describes.
# Idempotent: a verified tag and published release skip; a missing release
# resumes from the verified tag.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post_release:
    name: post_release
    if: vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/master'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Full history and credentials: the release script reads previous tags
        # and pushes a new one. This is the one workflow that must keep them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install gate toolchain
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/create_release.py
